name: Prix et mise en ligne

# Toutes les 30 minutes : releve des prix sur chaque marche, puis publication
# du site avec les prix frais. Rien n'est commite : les prix voyagent dans
# l'artefact Pages, l'historique du depot reste propre.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests brotli

      - name: Catalogue (caisses, Coverts, couteaux et gants)
        run: python scripts/build_catalog.py || echo "::warning::catalogue non regenere, version du depot conservee"

      - name: Prix
        env:
          CSFLOAT_API_KEY: ${{ secrets.CSFLOAT_API_KEY }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          python scripts/fetch_prices.py --previous "https://${owner}.github.io/${repo}/data/prices.json"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rapport (ce que le site va afficher)
        run: node tests/report.js || echo "::warning::rapport impossible"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
