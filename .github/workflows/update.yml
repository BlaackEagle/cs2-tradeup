name: Prix et mise en ligne

# Toutes les 30 minutes : releve des prix sur chaque marche, puis publication
# du site avec les prix frais. Rien n'est commite : les prix voyagent dans
# l'artefact Pages, l'historique du depot reste propre.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests brotli cryptography

      - name: Catalogue (caisses, Coverts, couteaux et gants)
        run: python scripts/build_catalog.py || echo "::warning::catalogue non regenere, version du depot conservee"

      # adresse reelle du site (domaine personnalise s'il y en a un)
      - id: pages
        uses: actions/configure-pages@v5

      - name: Prix
        env:
          CSFLOAT_API_KEY: ${{ secrets.CSFLOAT_API_KEY }}
        run: |
          echo "site : ${{ steps.pages.outputs.base_url }}"
          python scripts/fetch_prices.py --previous "${{ steps.pages.outputs.base_url }}/data/prices.json"

      # Stock de la boutique d'echange tradeit, item par item (float exact, prix,
      # piles) : donnees publiques. Si le releve echoue, le dernier stock publie
      # est garde 12 h au plus.
      - name: Stock tradeit (floats)
        run: |
          curl -sf -o site/data/tradeit.json "${{ steps.pages.outputs.base_url }}/data/tradeit.json" || rm -f site/data/tradeit.json
          python scripts/fetch_tradeit_stock.py || echo "::warning::stock tradeit non releve"

      # Inventaire tradeit de l'utilisateur, chiffre avant publication. Sans les
      # deux secrets, rien n'est publie. Le script n'ecrit ni identifiant ni montant.
      - name: Inventaire tradeit (chiffre)
        env:
          STEAM_ID: ${{ secrets.STEAM_ID }}
          INVENTORY_KEY: ${{ secrets.INVENTORY_KEY }}
        run: |
          base="${{ steps.pages.outputs.base_url }}"
          # reprend le dernier fichier publie si le releve echoue
          curl -sf -o site/data/inventory.enc.json "$base/data/inventory.enc.json" || rm -f site/data/inventory.enc.json
          python scripts/fetch_inventory.py || echo "::warning::inventaire non releve"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rapport (ce que le site va afficher)
        run: node tests/report.js || echo "::warning::rapport impossible"

      # Test du site dans un vrai navigateur, sur les prix qui vont etre publies.
      # Seulement sur push / lancement manuel, pas a chaque releve planifie.
      - name: Test navigateur sur les prix reels
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: |
          npm install -g playwright@1.56.1 > /dev/null
          npx -y playwright@1.56.1 install --with-deps chromium > /dev/null
          python -m http.server 8765 --directory site > /dev/null 2>&1 &
          sleep 1
          mkdir -p "$RUNNER_TEMP/captures"
          node tests/ui_check.js http://127.0.0.1:8765/ "$RUNNER_TEMP/captures"

      - name: Captures d'ecran
        if: always() && github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: ${{ runner.temp }}/captures
          retention-days: 7
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Controle du site publie, vu d'internet. N'echoue jamais le run (pas
  # d'e-mails d'echec en boucle) : le resultat se lit dans le log.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Le site en ligne repond
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          url="${PAGE_URL%/}"
          echo "adresse publiee : $url"
          sleep 20
          curl -sS -o page.html -w "accueil : HTTP %{http_code}, certificat %{ssl_verify_result} (0 = valide)\n" "$url/"
          grep -q "Trade-Up" page.html && echo "contenu : OK" || echo "contenu : MANQUANT"
          grep -q 'content="noindex' page.html && echo "noindex : OK" || echo "noindex : ABSENT"
          curl -sS -o prices.json "$url/data/prices.json"
          python3 -c "
          import json, datetime
          d = json.load(open('prices.json'))
          t = datetime.datetime.fromisoformat(d['updated_at'])
          age = (datetime.datetime.now(datetime.timezone.utc) - t).total_seconds() / 60
          live = [s['label'] for k, s in d['sources'].items() if k in ('sk', 'cf', 'dm', 'st') and s.get('ok')]
          print(f\"prix : {d['currency']}, releve il y a {age:.0f} min, sources live : {', '.join(live)}\")
          "
          echo "ancienne adresse github.io :"
          curl -sS -o /dev/null -w "  HTTP %{http_code} -> %{redirect_url}\n" "https://blaackeagle.github.io/cs2-tradeup/"
          echo "http -> https :"
          curl -sS -o /dev/null -w "  HTTP %{http_code} -> %{redirect_url}\n" "http://${url#https://}/"
