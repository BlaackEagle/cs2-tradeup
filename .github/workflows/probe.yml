name: Analyse ponctuelle (temporaire)

on:
  push:
    branches: [probe]

permissions:
  contents: read

jobs:
  bfk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Donnees du site en ligne
        run: |
          mkdir -p live
          for f in catalog.json prices.json tradeit.json; do
            curl -sf -o "live/$f" "https://tradeup.jaouadkabouri.dev/data/$f"
          done
          ls -la live
      - run: node scripts/contract_check.js live
